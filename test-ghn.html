<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test GHN API</title>
</head>

<body style="font-family:Arial;padding:20px">

<h1>Test API GHN</h1>

<p>Mã vận đơn</p>
<input id="tracking" value="GYRANEQB"
       style="width:100%;padding:12px;box-sizing:border-box">

<p>4 số cuối SĐT</p>
<input id="phone" value="6106" maxlength="4"
       inputmode="numeric"
       style="width:100%;padding:12px;box-sizing:border-box">

<br><br>

<button onclick="testGHN()" style="padding:15px 25px">
  TRA GHN
</button>

<pre id="result"
     style="white-space:pre-wrap;word-break:break-word;margin-top:25px"></pre>

<script>
async function testGHN() {
  const result = document.getElementById("result");

  result.textContent = "Đang tra...";

  const trackingNumber =
    document.getElementById("tracking").value.trim();

  const phoneLast4 =
    document.getElementById("phone").value.trim();

  try {
    const response = await fetch(
      "https://tainguyenmmo.vercel.app/api/ghn",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },

        body: JSON.stringify({
          trackingNumber: trackingNumber,
          phoneLast4: phoneLast4
        })
      }
    );

    const text = await response.text();

    result.textContent =
      "HTTP: " + response.status +
      "\n\n" +
      text;

  } catch (error) {

    result.textContent =
      "LỖI FETCH\n\n" +
      "Tên lỗi: " + error.name +
      "\n" +
      "Chi tiết: " + error.message;
  }
}
</script>

</body>
</html>
